name: Plugin checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python tools/build_web_plugin.py --check packages/device-control-0.1.0.skivu.json
      - run: python tools/build_web_plugin.py --check packages/device-control-0.1.1.skivu.json
      - run: python tools/build_web_plugin.py --check packages/device-control-0.2.0.skivu.json
      - run: python tools/build_web_plugin.py src --output rebuilt.skivu.json
      - run: cmp rebuilt.skivu.json packages/device-control-0.2.0.skivu.json
